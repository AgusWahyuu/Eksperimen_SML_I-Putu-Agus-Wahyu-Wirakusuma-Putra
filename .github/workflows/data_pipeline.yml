name: Data Preprocessing Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      - name: Run Preprocessing Script
        run: python preprocessing/automate_I-Putu-Agus-Wahyu-Wirakusuma-Putra.py

      - name: Commit and Push Clean Data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add preprocessing/diabetes_data_preprocessed.csv
          git commit -m "Auto-update data preprocessing" || echo "No changes to commit"
          git push
